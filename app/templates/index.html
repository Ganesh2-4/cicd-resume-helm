<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>{{ resume.name if resume.name else 'My Resume' }}</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f8f9fa; margin:40px; color:#222; }
    .card { background:white; padding:24px; border-radius:8px; max-width:800px; margin:auto; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    h1 { margin-bottom:0; }
    .tag { color:#777; margin-top:6px; }
    .section { margin-top:20px; }
    .muted { color:#555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ resume.name }}</h1>
    <p class="tag">{{ resume.title }}</p>

    <div class="section">
      <h2>Contact</h2>
      <ul>
        {% for key, value in resume.contact.items() %}
          <li><b>{{ key }}:</b> {{ value }}</li>
        {% endfor %}
      </ul>
    </div>

    <div class="section">
      <h2>Summary</h2>
      <p>{{ resume.summary }}</p>
    </div>

    <div class="section">
      <h2>Skills</h2>
      <ul>
        {% for s in resume.skills %}
          <li>{{ s }}</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</body>
</html>
